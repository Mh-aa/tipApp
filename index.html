<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Tip App</title>
		<link rel="stylesheet" href="css/fonts.css" />
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body class="site">
		<header>
			<h1>TIP APP</h1>
		</header>
		<main class="site-content">
			<form class="wrapper">
				<label for="bill">Input your bill</label>
				<input
					type="text"
					id="bill"
					name="bill"
					placeholder="E.g.: '10.00'"
				/>
				<div class="buttons-inline" data-action="hide">
					<button type="button" class="btn btn__small" id="5">
						5%
					</button>
					<button type="button" class="btn btn__small" id="7">
						7%
					</button>
					<button type="button" class="btn btn__small" id="10">
						10%
					</button>
				</div>
				<div class="buttons-inline" data-action="hide">
					<button type="button" class="btn btn__calc" id="custom">
						Custom tip
					</button>
					<button
						type="button"
						class="btn btn__calc cancel"
						id="reset"
					>
						Reset
					</button>
				</div>
				<label for="tip" class="hidden" id="label__custom"
					>Input your custom tip</label
				>
				<input
					type="text"
					id="tip"
					placeholder="Tip in %, e.g.: '10'"
					class="hidden"
				/>
				<div class="buttons-inline">
					<button
						type="button"
						class="btn btn__calc hidden"
						id="calc-button"
					>
						Calculate!
					</button>
					<button
						type="button"
						class="btn btn__calc cancel hidden"
						id="cancel-button"
					>
						Cancel
					</button>
				</div>
				<p class="hidden" id="message"></p>
			</form>
		</main>
		<footer class="footer">
			<div class="footer__container wrapper">
				<p>Tip App © 2026</p>
				<nav aria-label="Footer-Navigation">
					<ul class="footer__list">
						<li>
							<a href="/impressum.html">Impressum</a>
						</li>
						<li>
							<a href="/datenschutz.html">Datenschutz</a>
						</li>
					</ul>
				</nav>
				<div class="footer__meta">
					<p>
						Icons by
						<a
							target="_blank"
							href="https://icons8.com"
							rel="noopener noreferrer"
							>Icons8
							<span class="sr-only"
								>(öffnet in neuem Tab)</span
							></a
						>
					</p>
				</div>
			</div>
		</footer>
		<script src="./script.js" charset="utf-8"></script>
	</body>
</html>
