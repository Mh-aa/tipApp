<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Tip App</title>
		<link rel="stylesheet" href="css/fonts.css" />
		<link rel="stylesheet" href="css/style.css" />
		<script src="./script.js" defer></script>
	</head>
	<body class="site">
		<header>
			<h1>TIP APP</h1>
		</header>
		<main class="site-content">
			<form class="wrapper">
				<div class="overlay" aria-hidden="true"></div>
				<div
					class="modal-input"
					role="dialog"
					aria-modal="true"
					aria-labelledby="custom-tip-title"
				>
					<h2 id="custom-tip-title">Eigenen Prozentsatz eingeben</h2>
					<div>
						<label for="custom-tip-input">Prozentsatz</label>
						<input type="text" id="custom-tip-input" />
					</div>
					<div class="inline">
						<button type="button" class="btn" id="apply">
							Übernehmen
						</button>
						<button
							type="button"
							class="btn btn-secondary"
							id="cancel"
						>
							Abbrechen
						</button>
					</div>
				</div>
				<div>
					<label for="bill-input">Rechnungsbetrag</label>
					<input
						type="text"
						id="bill-input"
						name="bill-input"
						value="0,00 €"
						inputmode="numeric"
						required
					/>
				</div>
				<div class="inline">
					<button type="button" class="btn" data-tip="5">5%</button>
					<button type="button" class="btn" data-tip="7">7%</button>
					<button type="button" class="btn" data-tip="10">10%</button>
				</div>
				<div class="inline">
					<button type="button" class="btn" id="custom">
						Eigene %
					</button>
					<button type="reset" class="btn btn-secondary" id="reset">
						Zurücksetzen
					</button>
				</div>
				<dl class="paper">
					<div class="inline">
						<dt>Rechnungsbetrag:</dt>
						<dd id="bill-result" aria-live="polite">0,00 €</dd>
					</div>
					<div class="inline">
						<dt>Trinkgeld:</dt>
						<dd id="tip-result" aria-live="polite">0,00 €</dd>
					</div>
					<div class="inline">
						<dt>Gesamt:</dt>
						<dd id="total-result" aria-live="polite">0,00 €</dd>
					</div>
				</dl>
			</form>
		</main>
		<footer class="footer">
			<div class="footer__container">
				<p>Tip App © 2026</p>
				<nav aria-label="Footer-Navigation">
					<ul class="footer__list">
						<li>
							<a href="/impressum.html">Impressum</a>
						</li>
						<li>
							<a href="/datenschutz.html">Datenschutz</a>
						</li>
					</ul>
				</nav>
			</div>
		</footer>
	</body>
</html>
